set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off
set -g remain-on-exit on
set -g history-limit 50000
set -g default-terminal tmux-256color
# Hutch reads a thread's status from these: when it last rang the bell (its
# activity then), and when it was last resized (output right after is a redraw).
set-hook -g alert-bell 'set-option -wF @hutch-bell "#{window_activity}"'
set-hook -g window-resized 'run-shell -b "tmux set-option -w -t #{window_id} @hutch-resized $(date +%s)"'
