name        = "claude"
install     = "curl -fsSL https://claude.ai/install.sh | bash"
start       = "claude {prompt}"
autonomy    = { full = ["--dangerously-skip-permissions"], ask = [] }
pick        = "claude --resume"
resume      = "claude --resume {session_id}"
model       = "--model {model}"
models      = ["fable", "opus", "sonnet", "haiku"]
login       = "claude auth login"
sessions    = "~/.claude/projects/**/*.jsonl"
credentials = [
  { file = "~/.claude/.credentials.json", keys = ["claudeAiOauth"], secrets = ["accessToken", "refreshToken"] },
  { file = "~/.claude.json", keys = ["oauthAccount", "userID"] },
]
hosts       = ["anthropic.com", "claude.com", "claude.ai"]
token_url   = "https://platform.claude.com/v1/oauth/token"
config = [
  "~/.claude/CLAUDE.md",
  "~/.claude/settings.json",
  "~/.claude/skills/",
  "~/.claude/agents/",
  "~/.claude/commands/",
  "~/.claude/plugins/installed_plugins.json",
  "~/.claude/plugins/known_marketplaces.json",
  "~/.claude/plugins/cache/",
  { file = "~/.claude.json", keys = ["mcpServers"] },
]
mcp        = { file = "~/.claude.json", key = "mcpServers", format = "claude", secrets = ["env", "headers"], raw_secrets = ["oauth.clientSecret"], scoped = "projects", project = ".mcp.json", fields = { headers = "headers", type = "type" } }
transcript = "claude"

# First-run prompts a box would otherwise stop at, and the bell Hutch alerts on.
[[seed]]
file  = "~/.claude.json"
merge = { hasCompletedOnboarding = true, preferredNotifChannel = "terminal_bell", projects = { "{workspace}" = { hasTrustDialogAccepted = true } } }

[[seed]]
file  = "~/.claude/settings.json"
merge = { skipDangerousModePermissionPrompt = true }
