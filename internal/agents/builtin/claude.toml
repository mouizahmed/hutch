name        = "claude"
install     = "curl -fsSL https://claude.ai/install.sh | bash"
start       = "claude --session-id {session_id} {prompt}"
autonomy    = { full = ["--dangerously-skip-permissions"], ask = [] }
resume      = "claude --resume {session_id}"
login       = "claude auth login"
sessions    = "~/.claude/projects/**/*.jsonl"
credentials = [
  "~/.claude/.credentials.json",
  { file = "~/.claude.json", keys = ["oauthAccount", "userID"] },
]
config = [
  "~/.claude/CLAUDE.md",
  "~/.claude/settings.json",
  "~/.claude/skills/",
  "~/.claude/agents/",
  "~/.claude/commands/",
  "~/.claude/plugins/installed_plugins.json",
  "~/.claude/plugins/known_marketplaces.json",
  "~/.claude/plugins/cache/",
  { file = "~/.claude.json", keys = ["mcpServers"] },
]
mcp        = { file = "~/.claude.json", key = "mcpServers", format = "claude" }
transcript = "claude"

# First-run prompts a box would otherwise stop at.
[[seed]]
file  = "~/.claude.json"
merge = { hasCompletedOnboarding = true, projects = { "{workspace}" = { hasTrustDialogAccepted = true } } }

[[seed]]
file  = "~/.claude/settings.json"
merge = { skipDangerousModePermissionPrompt = true }
