name        = "codex"
# Codex's own installer: no Node needed, and no root.
install     = "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
start       = "codex {prompt}"
autonomy    = { full = ["--dangerously-bypass-approvals-and-sandbox"], ask = [] }
pick        = "codex resume"
resume      = "codex resume {session_id}"
model       = "--model {model}"
models      = ["gpt-6.1-sol", "gpt-6.1-terra", "gpt-6-astra", "gpt-6-luna"]
login       = "codex login"
sessions    = "~/.codex/sessions/**/*.jsonl"
credentials = [{ file = "~/.codex/auth.json", secrets = ["access_token", "refresh_token", "id_token", "OPENAI_API_KEY"] }]
hosts       = ["chatgpt.com", "openai.com"]
config      = ["~/.codex/config.toml", "~/.codex/AGENTS.md"]
mcp         = { file = "~/.codex/config.toml", key = "mcp_servers", format = "codex", secrets = ["env", "http_headers"], raw_secrets = ["oauth.client_secret"] }
transcript  = "codex"

[[seed]]
file  = "~/.codex/config.toml"
merge = { tui = { screen_reader_detection_done = true, notifications = true, notification_method = "bel", notification_condition = "always" }, projects = { "{workspace}" = { trust_level = "trusted" } } }
