name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a build rehearsal (no release is created)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ $RELEASE_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
          echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - run: make check
      - run: sh scripts/test-install.sh

  clients:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/release-clients.sh "$RELEASE_VERSION" dist/release
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients
          path: dist/release/*
          if-no-files-found: error

  machine:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/release-machine.sh "$RELEASE_VERSION" "$RELEASE_ARCH" dist/release
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: machine-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [check, clients, machine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      - name: Checksums and installer
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          cp install.sh LICENSE dist/release/
          printf '%s\n' "$RELEASE_VERSION" > dist/release/version.txt
          cd dist/release
          sha256sum *.tar.gz install.sh LICENSE version.txt > checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-checksums: dist/release/checksums.txt
      - name: Include signing bundle
        env:
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION" dist/release/attestation.sigstore.json
      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" dist/release/* \
            --draft --verify-tag --generate-notes --title "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error

  first-box:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: Check actual signed rehearsal artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/release
          sha256sum -c checksums.txt
          gh attestation verify "hutch_${{ needs.check.outputs.version }}_linux_amd64.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle attestation.sigstore.json \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Fresh OS account install and first box recording
        env:
          HUTCH_VERSION: ${{ needs.check.outputs.version }}
        run: |
          sudo useradd --create-home --shell /bin/bash hutch-first
          echo 'hutch-first ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/hutch-first >/dev/null
          sudo mkdir -p /home/hutch-first/work /home/hutch-first/tmp
          sudo mkdir -p /home/hutch-first/fixture/scripts
          sudo cp scripts/first-box.sh scripts/record-terminal.py scripts/runtime-machine.sh \
            /home/hutch-first/fixture/scripts/
          sudo cp -r dist/release /home/hutch-first/fixture/release
          sudo chown -R hutch-first:hutch-first /home/hutch-first
          sudo -u hutch-first env HOME=/home/hutch-first PATH="$PATH" \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_TEMP=/home/hutch-first/tmp \
            HUTCH_TEST_BACKEND=firecracker HUTCH_TEST_COMMIT="$GITHUB_SHA" \
            HUTCH_VERSION="$HUTCH_VERSION" HUTCH_TEST_ASSETS=/home/hutch-first/fixture/release \
            HUTCH_TEST_SOURCE=/home/hutch-first/fixture \
            bash -c 'cd /home/hutch-first/work && python3 "$HUTCH_TEST_SOURCE/scripts/record-terminal.py" \
              first-box.cast bash "$HUTCH_TEST_SOURCE/scripts/first-box.sh"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: first-box-recording
          path: |
            /home/hutch-first/work/first-box.cast
            /home/hutch-first/work/first-box-result.json
          if-no-files-found: warn
