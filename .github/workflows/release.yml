name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a build rehearsal (no release is created)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ $RELEASE_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
          echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - run: make check
      - run: sh scripts/test-install.sh

  clients:
    needs: [check, machine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/release-clients.sh "$RELEASE_VERSION" dist/release
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          MACHINE_SHA256: amd64=${{ needs.machine.outputs.sha256-amd64 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients
          path: dist/release/*
          if-no-files-found: error

  machine:
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      sha256-amd64: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/release-machine.sh "$RELEASE_VERSION" amd64 dist/release
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
      - id: sum
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: echo "sha256=$(sha256sum "dist/release/hutch-machine_${RELEASE_VERSION}_linux_amd64.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: machine-amd64
          path: dist/release/*
          if-no-files-found: error

  # Checksums and the signature; the draft release waits for the checks below.
  publish:
    needs: [check, clients, machine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      - name: Checksums and installer
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          cp install.sh LICENSE dist/release/
          printf '%s\n' "$RELEASE_VERSION" > dist/release/version.txt
          cd dist/release
          sha256sum *.tar.gz install.sh LICENSE version.txt > checksums.txt
      # Rehearsals aren't signed: a signature means a tagged release.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name == 'push'
        id: attest
        with:
          subject-checksums: dist/release/checksums.txt
      - name: Include signing bundle
        if: github.event_name == 'push'
        env:
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION" dist/release/attestation.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error

  first-box:
    needs: [check, publish]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/first-box.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
      source_sha: ${{ github.sha }}
      version: ${{ needs.check.outputs.version }}

  # The built CLI on each client platform: installed from these artifacts with
  # the real installer (Linux, macOS) or unpacked (Windows), and run without a
  # machine.
  client-check:
    needs: [check, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux_amd64
          - os: macos-latest
            archive: darwin_arm64
          - os: windows-latest
            archive: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: Install with install.sh from these artifacts
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          # curl serves the artifacts from disk; everything else is the real installer.
          mkdir -p "$RUNNER_TEMP/tools"
          cat > "$RUNNER_TEMP/tools/curl" <<'SH'
          #!/bin/sh
          for a; do case "$a" in https://*) url=$a;; esac; done
          while [ "$#" -gt 0 ]; do [ "$1" = -o ] && dest=$2; shift; done
          cp "$GITHUB_WORKSPACE/dist/release/${url##*/}" "$dest"
          SH
          chmod +x "$RUNNER_TEMP/tools/curl"
          PATH="$RUNNER_TEMP/tools:$PATH" HUTCH_VERSION="$RELEASE_VERSION" HUTCH_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Unpack after checking its SHA-256
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $name = "hutch_${env:RELEASE_VERSION}_${env:ARCHIVE}.tar.gz"
          $want = (Get-Content dist/release/checksums.txt | Where-Object { $_ -match [regex]::Escape($name) }) -split '\s+' | Select-Object -First 1
          $got = (Get-FileHash "dist/release/$name" -Algorithm SHA256).Hash.ToLower()
          if (-not $want -or $got -ne $want) { throw "checksum mismatch for $name" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\bin" | Out-Null
          tar -xzf "dist/release/$name" -C "$env:RUNNER_TEMP\bin"
          "$env:RUNNER_TEMP\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Run it without a machine
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config"
          mkdir -p "$XDG_CONFIG_HOME"
          cd "$RUNNER_TEMP"
          hutch --version | tee version.out
          grep -qx "hutch version $RELEASE_VERSION" version.out
          hutch --help > /dev/null
          hutch help more > /dev/null
          hutch machine --help | grep -q 'lead'
          if hutch doctor > doctor.out 2>&1; then cat doctor.out; exit 1; fi
          cat doctor.out
          grep -q 'no machine set' doctor.out
          if HUTCH_MACHINE=nosuch.invalid hutch ls > ls.out 2>&1; then exit 1; fi
          cat ls.out
          grep -q 'nosuch.invalid' ls.out

  # The draft release, only once every check of these exact artifacts passed.
  draft:
    if: github.event_name == 'push'
    needs: [check, publish, first-box, client-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          pre=()
          if [[ $RELEASE_VERSION == *-* ]]; then pre=(--prerelease); fi
          gh release create "$RELEASE_VERSION" dist/release/* "${pre[@]}" \
            --draft --verify-tag --generate-notes --title "$RELEASE_VERSION"
