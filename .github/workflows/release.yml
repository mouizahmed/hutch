name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a build rehearsal (no release is created)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ $RELEASE_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
          echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - run: make check
      - run: sh scripts/test-install.sh

  clients:
    needs: [check, machine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/release-clients.sh "$RELEASE_VERSION" dist/release
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          MACHINE_SHA256: amd64=${{ needs.machine.outputs.sha256-amd64 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients
          path: dist/release/*
          if-no-files-found: error

  machine:
    needs: check
    # Machines are amd64 only; an arm64 bundle needs its own output for clients.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    outputs:
      sha256-amd64: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/release-machine.sh "$RELEASE_VERSION" "$RELEASE_ARCH" dist/release
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
      - id: sum
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: echo "sha256=$(sha256sum "dist/release/hutch-machine_${RELEASE_VERSION}_linux_${RELEASE_ARCH}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: machine-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [check, clients, machine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      - name: Checksums and installer
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          cp install.sh LICENSE dist/release/
          printf '%s\n' "$RELEASE_VERSION" > dist/release/version.txt
          cd dist/release
          sha256sum *.tar.gz install.sh LICENSE version.txt > checksums.txt
      # Rehearsals aren't signed: a signature means a tagged release.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name == 'push'
        id: attest
        with:
          subject-checksums: dist/release/checksums.txt
      - name: Include signing bundle
        if: github.event_name == 'push'
        env:
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION" dist/release/attestation.sigstore.json
      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          pre=()
          if [[ $RELEASE_VERSION == *-* ]]; then pre=(--prerelease); fi
          gh release create "$RELEASE_VERSION" dist/release/* "${pre[@]}" \
            --draft --verify-tag --generate-notes --title "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error

  first-box:
    needs: [check, publish]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/first-box.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
      source_sha: ${{ github.sha }}
      version: ${{ needs.check.outputs.version }}
