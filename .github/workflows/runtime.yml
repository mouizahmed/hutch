name: runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      replay_run:
        description: 'Optional run whose synthetic snapshots should be replayed without rebuilding'
        required: false
        type: string
  schedule:
    - cron: '37 7 * * *'

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files:
    if: github.event_name != 'workflow_dispatch' || inputs.replay_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: images
        with:
          path: dist/images
          key: runtime-images-${{ runner.arch }}-${{ hashFiles('images/kernel/**', 'images/layer/**') }}
      - if: steps.images.outputs.cache-hit != 'true'
        run: make images
      - run: make build linux
      - name: Pack machine files
        run: |
          mkdir -p dist/runtime
          cp bin/hutch bin/linux-amd64/hutchd bin/linux-amd64/hutch-guest dist/runtime/
          cp dist/images/* dist/runtime/
      - name: Build a previous daemon for upgrade recovery
        run: |
          previous_ref=375eb5dd625f53879edd83facc0280ccf5ce5705
          git fetch --depth=1 origin "$previous_ref"
          previous_source=$(mktemp -d)
          trap 'rm -r -- "$previous_source"' EXIT
          git archive "$previous_ref" | tar -xf - -C "$previous_source"
          CGO_ENABLED=0 go -C "$previous_source" build -trimpath \
            -ldflags '-s -w -X github.com/mouizahmed/hutch/internal/version.Version=375eb5d' \
            -o "$GITHUB_WORKSPACE/dist/runtime/hutchd-previous" ./cmd/hutchd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-files
          path: dist/runtime/*
          if-no-files-found: error

  boxes:
    needs: files
    strategy:
      fail-fast: false
      matrix:
        backend: [firecracker, gvisor]
        exercise: [lifecycle, upgrade]
    name: ${{ matrix.backend }} / ${{ matrix.exercise }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-files
          path: dist/runtime
      - name: Set up a disposable machine
        env:
          HUTCH_TEST_BACKEND: ${{ matrix.backend }}
          HUTCH_TEST_PREVIOUS: ${{ matrix.exercise == 'upgrade' && '1' || '' }}
        run: scripts/runtime-machine.sh
      - name: Lifecycle, recovery, and isolation
        env:
          HUTCH_MACHINE: hutch-ci
          HUTCH_TEST_BACKEND: ${{ matrix.backend }}
          HUTCH_TEST_DISPOSABLE: '1'
          HUTCH_TEST_UPGRADE: ${{ matrix.exercise == 'upgrade' && '1' || '' }}
          HUTCH_TEST_FILES: ${{ github.workspace }}/dist/runtime
        run: |
          if [ "$HUTCH_TEST_UPGRADE" = 1 ]; then
            go test -tags runtime -count=1 -timeout 12m -v -run '^TestUpgrade$' ./internal/integration
          else
            go test -tags runtime -count=1 -timeout 12m -v -run '^(TestRuntime|TestCheckpointRecovery|TestCredentialIsolation)$' ./internal/integration
          fi
      - name: Machine logs
        if: always()
        run: |
          sudo journalctl -u hutchd --no-pager -n 250
          sudo journalctl -k --no-pager --since '20 minutes ago' --grep='oom|Out of memory|Killed process|runsc|gvisor' -n 100 || true

  snapshot-export:
    needs: files
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fc-current
            backend: firecracker
            fc: v1.17.0
          - name: fc-previous
            backend: firecracker
            fc: v1.16.0
          - name: gvisor
            backend: gvisor
            fc: ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-files
          path: dist/runtime
      - name: Set up a disposable source machine
        env:
          HUTCH_TEST_BACKEND: ${{ matrix.backend }}
        run: scripts/runtime-machine.sh
      - if: matrix.fc == 'v1.16.0'
        run: bash scripts/runtime-previous-firecracker.sh
      - name: Export a real snapshot with synthetic state
        env:
          HUTCH_TEST_FC: ${{ matrix.fc }}
        run: |
          sudo systemctl stop hutchd
          go test -tags runtime -c -o "$RUNNER_TEMP/exchange.test" ./internal/worker
          sudo env GITHUB_ACTIONS=true HUTCH_TEST_DISPOSABLE=1 HUTCH_TEST_FC="$HUTCH_TEST_FC" \
            HUTCH_TEST_EXCHANGE="$GITHUB_WORKSPACE/dist/exchange" \
            "$RUNNER_TEMP/exchange.test" -test.v -test.timeout=10m -test.run='^TestSnapshotExport$'
          sudo chown -R "$(id -u):$(id -g)" dist/exchange
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-${{ matrix.name }}
          path: dist/exchange
          retention-days: 3
          if-no-files-found: error

  snapshot-import:
    needs: [files, snapshot-export]
    strategy:
      fail-fast: false
      matrix:
        backend: [firecracker, gvisor]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-files
          path: dist/runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snapshot-*
          path: dist/exchange
      - name: Set up a disposable receiving machine
        env:
          HUTCH_TEST_BACKEND: ${{ matrix.backend }}
        run: scripts/runtime-machine.sh
      - name: Restore snapshots from other machines and backends
        run: |
          sudo systemctl stop hutchd
          go test -tags runtime -c -o "$RUNNER_TEMP/exchange.test" ./internal/worker
          sudo env GITHUB_ACTIONS=true HUTCH_TEST_DISPOSABLE=1 \
            HUTCH_TEST_EXCHANGE="$GITHUB_WORKSPACE/dist/exchange" \
            "$RUNNER_TEMP/exchange.test" -test.v -test.timeout=10m -test.run='^TestSnapshotImport$'
      - if: matrix.backend == 'firecracker'
        run: bash scripts/runtime-previous-firecracker.sh
      - name: Retain warm restores with the older runtime installed
        if: matrix.backend == 'firecracker'
        run: |
          sudo env GITHUB_ACTIONS=true HUTCH_TEST_DISPOSABLE=1 \
            HUTCH_TEST_EXCHANGE="$GITHUB_WORKSPACE/dist/exchange" \
            "$RUNNER_TEMP/exchange.test" -test.v -test.timeout=10m -test.run='^TestSnapshotImport$'

  snapshot-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.replay_run != ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only artifacts this workflow built, never a pull request's
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RUN: ${{ inputs.replay_run }}
        run: |
          [[ $REPLAY_RUN =~ ^[0-9]+$ ]] || exit 1
          read -r path event < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPLAY_RUN" --jq '[.path, .event] | @tsv')
          [[ $path == .github/workflows/runtime.yml && $event != pull_request* ]] || exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-files
          path: dist/runtime
          run-id: ${{ inputs.replay_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snapshot-*
          path: dist/exchange
          run-id: ${{ inputs.replay_run }}
          github-token: ${{ github.token }}
      - name: Set up a disposable receiving machine
        env:
          HUTCH_TEST_BACKEND: gvisor
        run: scripts/runtime-machine.sh
      - name: Replay the real imported snapshots
        run: |
          sudo systemctl stop hutchd
          go test -tags runtime -c -o "$RUNNER_TEMP/exchange.test" ./internal/worker
          for attempt in 1 2 3; do
            echo "Snapshot replay $attempt"
            sudo env GITHUB_ACTIONS=true HUTCH_TEST_DISPOSABLE=1 \
              HUTCH_TEST_EXCHANGE="$GITHUB_WORKSPACE/dist/exchange" \
              "$RUNNER_TEMP/exchange.test" -test.v -test.timeout=10m -test.run='^TestSnapshotImport$'
          done
