name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Private docs are never committed
        run: |
          if git ls-files | grep -Eq '^private(/|$)'; then
            echo "private/ must never be committed to this repo" >&2
            exit 1
          fi
      - run: make vet
      - run: make test
      - run: sh scripts/test-install.sh
      - run: make vuln
      - run: make build linux

  clients:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./cmd/hutch ./internal/agents ./internal/config ./internal/release

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  agent-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install tested native CLIs
        run: |
          npm install --global @openai/codex@0.166.0
          curl -fsSL --retry 3 https://claude.ai/install.sh | bash -s -- 2.1.314
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Native MCP discovery and calls without model turns
        run: |
          codex --version
          claude --version
          node compat/mcp-smoke.mjs
          node compat/mcp-oauth-smoke.mjs
      - name: Independent identity verifier
        run: node --test compat/identity-verifier.test.mjs

  compat:
    runs-on: ubuntu-latest
    container:
      image: golang@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5 # golang:1.27-bookworm
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: compat/run.sh
