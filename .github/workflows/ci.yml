name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Private docs are never committed
        run: |
          if git ls-files | grep -Eq '^private(/|$)'; then
            echo "private/ must never be committed to this repo" >&2
            exit 1
          fi
      - run: make vet
      - run: make test
      - run: make vuln
      - run: make build linux
